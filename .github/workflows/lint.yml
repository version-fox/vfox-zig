name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lua:
    if: github.repository == 'version-fox/vfox-zig'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .
      - uses: jdx/mise-action@v5
      - name: Check Lua
        run: mise x aqua:LuaLS/lua-language-server@3.19.1 -- lua-language-server --check . --checklevel=Warning

  go:
    if: github.repository == 'version-fox/vfox-zig'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
      # GOOS=windows compiles the Windows build of the tests as well.
      - name: Run go vet
        working-directory: tests/e2e
        run: |
          go vet ./...
          GOOS=windows go vet ./...

  dockerfile:
    if: github.repository == 'version-fox/vfox-zig'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < tests/e2e/linux/Dockerfile

  workflows:
    if: github.repository == 'version-fox/vfox-zig'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
