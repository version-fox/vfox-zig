name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request replaces the run of the push before it. Every
# commit on main gets a group of its own, so one run never cancels another's result.
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-linux:
    if: github.repository == 'version-fox/vfox-zig'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      # The same pinned vfox as tests/e2e/linux/Dockerfile and test.yml.
      - name: Install vfox
        env:
          VFOX_VERSION: 1.1.0
          VFOX_SHA256: 3b33c3c468b27bc17aecf0d6d3af24fe49fe204972984904a136a47b402a0ee4
        run: |
          archive="$RUNNER_TEMP/vfox.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/version-fox/vfox/releases/download/v${VFOX_VERSION}/vfox_${VFOX_VERSION}_linux_x86_64.tar.gz"
          echo "$VFOX_SHA256  $archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/vfox"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/vfox" --strip-components=1 \
            "vfox_${VFOX_VERSION}_linux_x86_64/vfox"
          echo "$RUNNER_TEMP/vfox" >> "$GITHUB_PATH"
      - name: Run the e2e checks on Linux
        working-directory: tests/e2e
        run: go test -v -count=1 -timeout 40m -run TestE2E .

  e2e-windows:
    if: github.repository == 'version-fox/vfox-zig'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Install vfox
        shell: pwsh
        env:
          VFOX_VERSION: 1.1.0
          VFOX_SHA256: 1bbec8fffddbb62de0d93030c3f6203c69680662bc65257ca4a5e611cb607d0a
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'vfox.zip'
          curl.exe --fail --silent --show-error --location --retry 3 --output $archive "https://github.com/version-fox/vfox/releases/download/v$env:VFOX_VERSION/vfox_$($env:VFOX_VERSION)_windows_x86_64.zip"
          $digest = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($digest -ne $env:VFOX_SHA256) {
            throw "vfox archive checksum mismatch: $digest"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'vfox'
          Expand-Archive -Path $archive -DestinationPath $dir
          $exe = Get-ChildItem -Path $dir -Recurse -Filter vfox.exe | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
      - name: Run the e2e checks on Windows
        shell: pwsh
        working-directory: tests/e2e
        run: go test -v -count=1 -timeout 50m -run TestE2E .
